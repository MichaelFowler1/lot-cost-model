name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # One job now. There used to be a second, "without cost_core", because the
  # tool carried its own copy of the engine and only the risk halves needed the
  # library. The engine, the WBS roll-up and the workbook writers are all
  # cost_core's now, so there is nothing left to run without it and nothing for
  # that job to assert.
  #
  # It was also where the supported floor was checked, so the floor moves here:
  # every annotation is deferred with `from __future__ import annotations`, so
  # PEP 604 syntax costs nothing at runtime and 3.9 is the real floor rather
  # than 3.10. cost_core holds the same floor. The README says 3.9, so CI has
  # to hold it.
  tests:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The runner is named per lane rather than left at ubuntu-latest,
        # because 3.9 is the one version that cannot follow it. setup-python
        # has linux builds of 3.9 for Ubuntu images up to 24.04 and nothing
        # newer, and as 3.9 is past end of life none is coming. The day
        # ubuntu-latest moves to 26.04 an unpinned 3.9 lane fails at setup,
        # and with it the only check that the tool still runs on the floor
        # the README names. cost-core pins its 3.9 lane the same way.
        include:
          - python-version: "3.9"
            runner: ubuntu-24.04
          - python-version: "3.10"
            runner: ubuntu-latest
          - python-version: "3.11"
            runner: ubuntu-latest
          - python-version: "3.12"
            runner: ubuntu-latest
          - python-version: "3.13"
            runner: ubuntu-latest
          - python-version: "3.14"
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # lot_cost_model imports tkinter at module scope. Importing it is enough
      # for these tests; no window is ever created, so no display is needed.
      - name: Install Tk
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Check tkinter imports
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      # requirements.txt pins cost-core to a release on PyPI. lot_cost_model.py
      # repeats that version in its ImportError hint, so a bump touches both.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Confirm cost_core is present
        run: |
          python -c "import cost_core; print('cost_core', cost_core.__version__)"

      - name: Run tests
        run: pytest -v

  # The one-file build is a deliverable in its own right and nothing else in
  # this workflow exercises it: the suite imports the tool from the checkout.
  # So build the archive and run it from a venv holding only the four compiled
  # dependencies it cannot carry, with the checkout off the path, which is the
  # machine a colleague actually has.
  archive:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling. The archive is plain source, so the
        # versions in between add nothing the suite above does not cover.
        # 3.9 stays on ubuntu-24.04 for the reason given on the tests job.
        include:
          - python-version: "3.9"
            runner: ubuntu-24.04
          - python-version: "3.14"
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tk
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # The build vendors whichever cost_core this interpreter imports, so it
      # needs the library installed here first. requirements.txt pins it to
      # a release on PyPI.
      - name: Build the archive
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python tools/build_pyz.py --out "$RUNNER_TEMP/dist"

      - name: Run it from a venv holding only numpy, pandas, openpyxl and scipy
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv "$RUNNER_TEMP/bare"
          "$RUNNER_TEMP/bare/bin/pip" install numpy pandas openpyxl scipy
          "$RUNNER_TEMP/bare/bin/python" - "$RUNNER_TEMP/dist/lot-cost-model.pyz" <<'EOF'
          import importlib.util, sys
          arc = sys.argv[1]
          assert importlib.util.find_spec("matplotlib") is None, "matplotlib leaked in"
          assert importlib.util.find_spec("cost_core") is None, "cost_core installed outside the archive"
          sys.path.insert(0, arc)
          import lot_cost_model as M, cost_core
          assert M.__file__.startswith(arc) and cost_core.__file__.startswith(arc)
          import pandas as pd
          an = pd.DataFrame({"Lot": range(1, 7), "Lot FY": range(2015, 2021),
                             "Qty": [float(r[1]) for r in M.EXAMPLE_ANALOGY],
                             "AUC ($K)": [float(r[2]) for r in M.EXAMPLE_ANALOGY]})
          es = pd.DataFrame({"Lot": range(1, 7), "Lot FY": [int(r[0]) for r in M.EXAMPLE_ESTIMATE],
                             "Qty": [float(r[1]) for r in M.EXAMPLE_ESTIMATE],
                             "Complexity": [float(r[2]) for r in M.EXAMPLE_ESTIMATE]})
          proj, ctx = M.run_lot_cost_model(an, es)
          res = M.risk.run_risk(ctx, proj, M.generate_analyst_summary(ctx, {"Program": "CI"}),
                                M.risk.RiskOptions(n_iter=2000, seed=11))
          print("archive ok: cost_core", cost_core.__version__, "| P80", round(res.p80, 2))
          EOF
